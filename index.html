<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snow Globe Atlas</title>
  <meta name="description" content="A collection of snow globes from cities around the world, on an interactive 3D globe.">
  <meta name="theme-color" content="#070b16">
  <meta name="color-scheme" content="dark">

  <!-- Home screen / app icon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snow Globes">

  <!-- Link previews (WhatsApp, iMessage…) -->
  <meta property="og:title" content="Snow Globe Atlas">
  <meta property="og:description" content="A collection of snow globes from cities around the world.">
  <meta property="og:image" content="assets/icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Map (full screen) -->
  <div id="map" aria-label="Interactive globe of the snow globe collection"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Loading screen -->
  <div id="loader" class="loader" role="status">
    <div class="loader-globe" aria-hidden="true"><span>❄</span></div>
    <p>Shaking the snow globes…</p>
  </div>

  <!-- Top: brand, search, continent filters -->
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">❄</span>
        <div>
          <h1>Snow Globe Atlas</h1>
          <p id="brand-sub" class="brand-sub">&nbsp;</p>
        </div>
      </div>
      <button id="reset-view" class="icon-btn glass" type="button" aria-label="Back to the whole globe" title="Whole globe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
      </button>
    </div>

    <div class="search glass">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search a city or country" autocomplete="off" spellcheck="false" aria-label="Search a city or country">
      <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>

    <nav id="chips" class="chips" aria-label="Filter by continent"></nav>
  </header>

  <!-- Drawer: collection + stats -->
  <section id="drawer" class="drawer glass" data-state="peek" aria-label="Collection">
    <div class="drawer-handle" id="drawer-handle" role="button" tabindex="0" aria-label="Expand or collapse the panel">
      <span class="grip" aria-hidden="true"></span>
    </div>
    <div class="drawer-head">
      <div id="drawer-summary" class="drawer-summary"></div>
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="collection" aria-selected="true">Collection</button>
        <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
      </div>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div id="panel-collection" class="panel" role="tabpanel">
        <div class="sortbar" role="group" aria-label="Sort">
          <button class="sort active" data-sort="newest">Newest</button>
          <button class="sort" data-sort="city">A–Z</button>
          <button class="sort" data-sort="country">By country</button>
        </div>
        <div id="grid" class="grid"></div>
      </div>
      <div id="panel-stats" class="panel" role="tabpanel" hidden></div>
    </div>
  </section>

  <!-- Detail sheet for one snow globe -->
  <article id="detail" class="detail glass" aria-hidden="true" aria-live="polite">
    <div class="detail-hero" id="detail-hero">
      <canvas id="snow" class="snow" aria-hidden="true"></canvas>
      <button id="detail-close" class="icon-btn detail-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="detail-body">
      <div class="detail-title">
        <div>
          <h2 id="detail-city"></h2>
          <p id="detail-country" class="detail-country"></p>
        </div>
        <span id="detail-flag" class="detail-flag" aria-hidden="true"></span>
      </div>
      <div id="detail-meta" class="detail-meta"></div>
      <p id="detail-notes" class="detail-notes" hidden></p>
      <div class="detail-actions">
        <button id="detail-prev" class="pill-btn" type="button" aria-label="Previous snow globe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="detail-pos" class="detail-pos"></span>
        <button id="detail-next" class="pill-btn" type="button" aria-label="Next snow globe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="detail-share" class="pill-btn share" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>
          Share
        </button>
      </div>
    </div>
  </article>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
